name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout with godot-cpp
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install SCons and Android toolchain
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless ca-certificates unzip python3-pip g++ make file
          python3 -m pip install --user 'SCons==4.8.1'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=/usr/lib/android-sdk
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          java -version
          scons --version
          command -v sdkmanager
          # sdkmanager closes stdin after accepting licenses; `yes` may exit via SIGPIPE.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;23.2.8568313"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/ndk/23.2.8568313/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"

      - name: Build Linux and Android GDExtension libraries
        shell: bash
        run: |
          set -euo pipefail
          scons -j2 platform=linux target=template_debug arch=x86_64
          scons -j2 platform=linux target=template_release arch=x86_64
          scons -j2 platform=android target=template_debug arch=arm32 ndk_version=23.2.8568313
          scons -j2 platform=android target=template_debug arch=arm64 ndk_version=23.2.8568313
          test -s native/bin/librazor_path.linux.template_debug.x86_64.so
          test -s native/bin/librazor_path.linux.template_release.x86_64.so
          test -s native/bin/librazor_path.android.template_debug.arm32.so
          test -s native/bin/librazor_path.android.template_debug.arm64.so
          file native/bin/*.so

      - name: Configure Godot Android editor settings
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          EOF
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          test -f "$HOME/.android/debug.keystore"
          test -d "$ANDROID_HOME"
          test -x "$JAVA_HOME/bin/java"

      - name: Import project with Godot 4.4.1
        run: godot --headless --editor --quit --audio-driver Dummy --path .

      - name: Run deterministic 250-stage generator tests
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run project checks and generated campaign tests
        run: node --test test/godot-check.test.mjs test/exported-pack-profile.test.mjs test/razor-gen.test.mjs

      # The legacy GDScript contract suite depends on the removed autoload runtime.
      # Its active-runtime replacement is the native extension smoke test below.
      - name: Run native extension smoke test
        shell: bash
        run: |
          set -euo pipefail
          smoke_home="$(mktemp -d)"
          trap 'rm -rf "$smoke_home"' EXIT
          XDG_DATA_HOME="$smoke_home" godot --headless --audio-driver Dummy --path . --script test/native_extension_smoke.gd

      - name: Install Android export template
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -O /tmp/godot-templates.tpz
          unzip -jo /tmp/godot-templates.tpz 'templates/android_debug.apk' -d "$HOME/.local/share/godot/export_templates/4.4.1.stable"

      - name: Export Android debug APK and verify signature/libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --path . --export-debug Android build/android/RazorPath-debug.apk
          test -s build/android/RazorPath-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/android/RazorPath-debug.apk
          unzip -l build/android/RazorPath-debug.apk > /tmp/apk-contents.txt
          grep -F 'lib/armeabi-v7a/librazor_path.android.template_debug.arm32.so' /tmp/apk-contents.txt
          grep -F 'lib/arm64-v8a/librazor_path.android.template_debug.arm64.so' /tmp/apk-contents.txt

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: razor-path-android-apk
          path: build/android/RazorPath-debug.apk
          if-no-files-found: error
