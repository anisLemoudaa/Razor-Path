name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project
        run: godot --headless --editor --quit --audio-driver Dummy

      - name: Run gameplay and UI contracts
        run: godot --headless --audio-driver Dummy --path . --script test/gameplay_contract.gd && godot --headless --audio-driver Dummy --path . --script test/ui_contract.gd && godot --headless --audio-driver Dummy --path . --script test/tweak_regression.gd && godot --headless --audio-driver Dummy --path . --script test/vfx_regression.gd

      - name: Run smoke test
        continue-on-error: true
        run: godot --headless --path . -s test/smoke.gd

      - name: Install Web export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -O /tmp/godot-templates.tpz
          unzip -jo /tmp/godot-templates.tpz 'templates/web_nothreads_debug.zip' 'templates/web_nothreads_release.zip' 'templates/android_debug.apk' 'templates/android_release.apk' -d "$HOME/.local/share/godot/export_templates/4.4.1.stable"

      - name: Export Web build
        run: mkdir -p build && godot --headless --path . --export-release Web build/index.html

      - name: Export Android APK
        run: mkdir -p build && godot --headless --path . --export-debug Android build/AshenGauntlet.apk

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashen-gauntlet-web
          path: build/
          if-no-files-found: error

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashen-gauntlet-apk
          path: build/AshenGauntlet.apk
          if-no-files-found: error
