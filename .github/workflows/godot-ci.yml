name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android Java toolchain
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-17-jdk-headless ca-certificates unzip
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          java -version
          keytool -help >/dev/null

      - name: Configure Godot Android editor settings
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          EOF
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          test -f "$HOME/.android/debug.keystore"
          test -d /usr/local/lib/android/sdk
          test -x "$JAVA_HOME/bin/java"

      - name: Import project
        run: godot --headless --editor --quit --audio-driver Dummy

      - name: Run gameplay and UI contracts
        run: godot --headless --audio-driver Dummy --path . --script test/gameplay_contract.gd && godot --headless --audio-driver Dummy --path . --script test/ui_contract.gd && godot --headless --audio-driver Dummy --path . --script test/tweak_regression.gd && godot --headless --audio-driver Dummy --path . --script test/vfx_regression.gd

      - name: Run smoke test
        continue-on-error: true
        run: godot --headless --path . -s test/smoke.gd

      - name: Install Web export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -O /tmp/godot-templates.tpz
          unzip -jo /tmp/godot-templates.tpz 'templates/web_nothreads_debug.zip' 'templates/web_nothreads_release.zip' 'templates/android_debug.apk' 'templates/android_release.apk' -d "$HOME/.local/share/godot/export_templates/4.4.1.stable"

      - name: Export Web build
        run: mkdir -p build && godot --headless --path . --export-release Web build/index.html

      - name: Export Android APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug Android build/android/RazorPath-debug.apk
          test -s build/android/RazorPath-debug.apk

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: razor-path-web
          path: build/index.html
          if-no-files-found: error

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: razor-path-android-apk
          path: build/android/RazorPath-debug.apk
          if-no-files-found: error
